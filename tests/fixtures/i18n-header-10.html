<!DOCTYPE html>
<html lang="en" data-theme="light" data-theme-preference="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>LiveMemory · i18n header layout fixture</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/components.css">
</head>
<body>
  <div class="app-shell" id="app">
    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open navigation" aria-expanded="false">
          <span class="menu-bars" aria-hidden="true"></span>
        </button>
        <div class="topbar-title" id="page-title">Live recording</div>
        <div class="topbar-actions">
          <span class="privacy-note" id="privacy-note">Everything stays on this computer</span>
          <div class="language-control" role="group" aria-label="Interface language">
            <button class="icon-button language-system-button" id="language-system" type="button" aria-pressed="true" title="Follow the system language">
              <span class="language-globe" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="none">
                  <circle cx="8" cy="8" r="6.1" stroke="currentColor" stroke-width="1.3"></circle>
                  <path d="M1.9 8h12.2M8 1.9c1.8 1.8 2.7 3.9 2.7 6.1S9.8 12.3 8 14.1C6.2 12.3 5.3 10.2 5.3 8S6.2 3.7 8 1.9Z" stroke="currentColor" stroke-width="1.1"></path>
                </svg>
              </span>
            </button>
            <div class="segmented language-segmented" id="language-segmented" role="group" aria-label="Interface language"></div>
            <label class="language-compact">
              <span class="language-globe" aria-hidden="true">
                <svg viewBox="0 0 16 16" width="15" height="15" fill="none">
                  <circle cx="8" cy="8" r="6.1" stroke="currentColor" stroke-width="1.3"></circle>
                  <path d="M1.9 8h12.2M8 1.9c1.8 1.8 2.7 3.9 2.7 6.1S9.8 12.3 8 14.1C6.2 12.3 5.3 10.2 5.3 8S6.2 3.7 8 1.9Z" stroke="currentColor" stroke-width="1.1"></path>
                </svg>
              </span>
              <span class="sr-only">Interface language</span>
              <select class="language-select" id="language-select" aria-label="Interface language"></select>
            </label>
          </div>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle theme" title="Theme">
            <span class="theme-icon" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <div class="view" id="view">
        <div class="card card--padded">
          <h1 class="page-title">Recording</h1>
          <p class="page-subtitle">This fixture renders the real header CSS with ten simulated interface languages. It is not part of the product language list.</p>
          <div class="inline">
            <button class="button button--primary" type="button">Start recording</button>
            <button class="button button--secondary" type="button">Check live room</button>
          </div>
        </div>
        <div class="card card--padded" style="margin-top:16px">
          <div class="card-title">AI analysis</div>
          <p class="small tertiary">The language control must not push the theme button, title or page content out of the viewport.</p>
        </div>
      </div>
    </main>
  </div>
  <script type="module">
    import {renderLanguageControl} from '/js/language-control.js';
    import {TEN_LOCALE_FIXTURE} from '/fixtures/locales-10.mjs';
    renderLanguageControl({
      root: document.querySelector('.language-control'),
      segmented: document.getElementById('language-segmented'),
      systemButton: document.getElementById('language-system'),
      select: document.getElementById('language-select'),
      locales: TEN_LOCALE_FIXTURE,
      preference: 'pt-BR',
      systemLabel: 'System language',
      systemAriaLabel: 'Follow the system language',
      ariaLabel: 'Interface language',
      onChange: () => {}
    });
    window.__LM_FIXTURE_READY__ = true;
  </script>
</body>
</html>
